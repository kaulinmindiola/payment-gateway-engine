name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Mínimo privilegio por defecto. Solo publish-image amplía permisos.
permissions:
  contents: read

# En PRs, un push nuevo cancela la ejecución anterior. En main no se cancela
# nunca: una publicación a medias dejaría la imagen en un estado incoherente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitarios + ArchUnit + integración con Testcontainers (incluye los tests
      # de concurrencia y de resiliencia).
      - name: Build and test
        run: ./mvnw -B verify

      # Con @coverage-gate: sin él, jacoco:check corre sin reglas y siempre pasa.
      - name: Coverage gate (domain + application)
        run: ./mvnw -B jacoco:check@coverage-gate

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore