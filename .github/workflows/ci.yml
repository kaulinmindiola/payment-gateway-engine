name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Mínimo privilegio por defecto. Solo publish-image amplía permisos.
permissions:
  contents: read

# En PRs, un push nuevo cancela la ejecución anterior. En main no se cancela
# nunca: una publicación a medias dejaría la imagen en un estado incoherente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitarios + ArchUnit + integración con Testcontainers (incluye los tests
      # de concurrencia y resiliencia.
      - name: Build and test
        run: ./mvnw -B verify

      # Con @coverage-gate: sin él, jacoco:check corre sin reglas y siempre pasa.
      - name: Coverage gate (domain + application)
        run: ./mvnw -B jacoco:check@coverage-gate

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  docker-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from template
        run: cp .env.example .env

      - name: Start the full environment
        run: docker compose up -d --build --wait --wait-timeout 180

      # --wait espera a los servicios con healthcheck; la aplicación no tiene uno,
      # así que se reintenta hasta que Spring termina de arrancar.
      - name: Wait for application health (CS-04)
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health; then echo; exit 0; fi
            sleep 2
          done
          echo "Application did not become healthy in time"
          exit 1

      # Perfil docker + Flyway + seed funcionando, no solo el proceso vivo.
      - name: Verify seeded catalog
        run: |
          count=$(curl --fail --silent http://localhost:8080/api/v1/external-banks \
            | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "Seeded external banks: $count"
          test "$count" -eq 2

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish-image:
    needs: [build-and-test, docker-smoke]
    # Solo tras un merge a main, nunca en un PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # GITHUB_TOKEN: sin secretos adicionales
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Vincula el paquete de GHCR con el repositorio.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}