spring:
  application:
    name: payment-gateway-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_gateway
    username: postgres
    password: changeme

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus