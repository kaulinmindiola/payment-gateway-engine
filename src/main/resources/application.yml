server:
  port: ${SERVER_PORT:8080} 

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_gateway_engine}
    username: ${DB_USERNAME:pge_user}
    password: ${DB_PASSWORD}  

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: always
      show-details: never
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: payment-gateway-engine

payment-gateway:
  authorization-provider:
    base-url: ${AUTHORIZATION_PROVIDER_BASE_URL:http://localhost:8089}

resilience4j:
  circuitbreaker:
    instances:
      authorizationProvider:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        allowHealthIndicatorToFail: true
  retry:
    instances:
      authorizationProvider:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.paymentgateway.engine.infrastructure.adapter.http.AuthorizationTechnicalException